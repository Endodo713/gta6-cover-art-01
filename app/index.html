<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Vice — GTA VI Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Neon Vice</h1>
    <p>GTA VI-style multi-panel cover art. Sunset/neon grade, bold lettering, exported offline as PNG.</p>
    <label>Photo <input id="photo" type="file" accept="image/*"></label>
    <label>Caption <input id="caption" type="text" maxlength="60" value="Sunset Heist"></label>
    <div class="actions">
      <button id="export" type="button">Export PNG &nbsp;(1080×1080 · 1080×1350 · 1920×1080)</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
